- name: NODE CONTROLLER SYSTEM (STABLE ORDERED BOOTSTRAP)
  hosts: localhost
  become: yes

  tasks:

  # =========================
  # 1. BASE SYSTEM
  # =========================

  - name: Update system
    apt:
      update_cache: yes
      upgrade: dist

  - name: Install base tools
    apt:
      name:
        - curl
        - git
        - vim
        - htop
        - openssh-server
      state: present

  - name: Enable SSH
    systemd:
      name: ssh
      enabled: yes
      state: started


  # =========================
  # 2. DOCKER (MUSI BYĆ PIERWSZY RUNTIME)
  # =========================

  - name: Install Docker
    shell: curl -fsSL https://get.docker.com | sh
    args:
      creates: /usr/bin/docker

  - name: Start Docker
    systemd:
      name: docker
      enabled: yes
      state: started


  # =========================
  # 3. OPENWEBUI (UI LAYER)
  # =========================

  - name: Run OpenWebUI
    shell: |
      docker run -d \
        --name openwebui \
        -p 3000:8080 \
        -v open-webui:/app/backend/data \
        --restart always \
        ghcr.io/open-webui/open-webui:main


  # =========================
  # 4. NODE CONTROLLER (AGENT CORE)
  # =========================

  - name: Run Node Controller
    shell: |
      docker run -d \
        --name node-controller \
        --restart always \
        ubuntu:22.04 \
        bash -c "while true; do echo node-controller alive; sleep 5; done"


  # =========================
  # 5. K3S (CLUSTER LAYER - LAST)
  # =========================

  - name: Install k3s
    shell: curl -sfL https://get.k3s.io | sh -
