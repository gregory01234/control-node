- name: NODE CONTROLLER SYSTEM (STABLE BOOTSTRAP)
  hosts: control
  become: yes

  tasks:

  # =========================
  # BASE SYSTEM
  # =========================

  - name: Update system
    apt:
      update_cache: yes
      upgrade: dist

  - name: Install base tools
    apt:
      name:
        - curl
        - git
        - vim
        - htop
        - openssh-server
      state: present

  - name: Enable SSH
    systemd:
      name: ssh
      enabled: yes
      state: started

  # =========================
  # DOCKER (SAFE INSTALL)
  # =========================

  - name: Install Docker (official script)
    shell: curl -fsSL https://get.docker.com | sh
    args:
      creates: /usr/bin/docker

  - name: Start Docker service
    systemd:
      name: docker
      enabled: yes
      state: started

  # =========================
  # OPENWEBUI
  # =========================

  - name: Run OpenWebUI container
    shell: |
      docker run -d \
        --name openwebui \
        -p 3000:8080 \
        -v open-webui:/app/backend/data \
        --restart always \
        ghcr.io/open-webui/open-webui:main
    args:
      creates: /var/lib/docker/volumes/open-webui

  # =========================
  # NODE CONTROLLER (CORE AGENT)
  # =========================

  - name: Create Node Controller directory
    file:
      path: /opt/node-controller
      state: directory

  - name: Create Node Controller script
    copy:
      dest: /opt/node-controller/controller.sh
      mode: '0755'
      content: |
        #!/bin/bash
        while true; do
          echo "[Node Controller] alive"
          sleep 5
        done

  - name: Run Node Controller container
    shell: |
      docker run -d \
        --name node-controller \
        --restart always \
        ubuntu:22.04 \
        bash -c "while true; do echo node-controller alive; sleep 5; done"
